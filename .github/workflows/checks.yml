name: Build, contracts and platform checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt
      - run: npm run native:configure
      - run: npm run native:build
      - if: runner.os == 'Windows'
        run: npm run check:defender -- -UpdateSignatures
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - run: npm run build
      - run: npm test
      - run: npm run test:local-files
      - if: runner.os != 'Linux'
        run: npm run test:results-ui
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 2560x1440x24' npm run test:results-ui
      - if: runner.os != 'Linux'
        run: npm run test:results-integration
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:results-integration
      - run: npm run test:results-privacy
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:trash-unavailable
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_update_windows.ps1
      - if: runner.os == 'Linux'
        run: python tests/test_update_linux.py
      - if: runner.os != 'Linux'
        run: npm run test:desktop
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - run: npm run test:backend
      - run: npm run test:server
      - if: runner.os == 'Linux'
        run: npm run test:delivery:deployment
      - run: npm run test:native
      - run: npm run test:statistics
      - run: npm run test:traversal
      - run: npm run test:comparison
      - run: npm run test:content
      - run: npm run test:resume
      - run: npm run test:runtime
      - run: npm run test:drives
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_windows_volume_mount.ps1
      - if: runner.os == 'macOS'
        run: python tests/test_macos_volume.py
      - if: runner.os == 'Linux'
        run: sudo env DUPROVE_ANALYZER="$PWD/build/native/bin/duprove-analyzer" unshare --mount --propagation private python3 tests/test_linux_mount_namespace.py
      - run: npm run test:installer
      - run: npm run package
      - if: runner.os == 'Linux'
        run: python tests/test_linux_archive.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a node tests/packaged-startup.cjs release/linux-unpacked/duprove
      - if: runner.os == 'macOS'
        run: python tests/test_macos_package.py
      - if: runner.os == 'macOS'
        run: node tests/packaged-startup.cjs release/mac*/Duprove.app/Contents/MacOS/Duprove
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: defender-checks
          path: .verification/defender/*.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Duprove-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.tar.gz
            release/Duprove-*.pkg
            release/Duprove-*.dmg
          if-no-files-found: error
