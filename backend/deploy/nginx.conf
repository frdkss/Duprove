worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    default_type application/json;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 32m;
    client_body_buffer_size 32k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 2k;
    client_header_timeout 5s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 5s;
    reset_timedout_connection on;
    limit_req_zone $binary_remote_addr zone=per_ip:1m rate=6r/m;
    limit_req_zone $server_name zone=global:1m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        limit_req_status 429;
        limit_conn_status 429;
        limit_conn connections 2;
        error_page 400 404 405 408 409 411 413 414 415 422 429 431 494 495 496 497 500 502 503 504 /api-error;
        location = /api-error {
            internal;
            # Original HTTP error status is preserved; no request values reflected.
            return 200 '{"accepted":false,"error":"request_rejected"}';
        }
        location = /v1/reports {
            if ($request_method != POST) { return 405; }
            if ($args != '') { return 400; }
            limit_req zone=per_ip burst=3 nodelay;
            limit_req zone=global burst=10 nodelay;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 40s;
            proxy_http_version 1.1;
            # Forward only headers used by the API. No IP, UA, cookie or query.
            proxy_pass_request_headers off;
            proxy_set_header Host receiver;
            proxy_set_header Connection close;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Content-Encoding $http_content_encoding;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_pass http://receiver:8000;
        }
        location / { return 404; }
    }
}
