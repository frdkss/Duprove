name: duprove-statistics
services:
  receiver:
    image: ${COMPOSE_PROJECT_NAME:-duprove-statistics}-receiver:local
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 32
    ulimits:
      core: 0
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m,mode=1777']
    volumes: [reports:/data]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: none
  retention:
    image: ${COMPOSE_PROJECT_NAME:-duprove-statistics}-receiver:local
    pull_policy: never
    command: [python, -m, duprove_backend.maintenance]
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.1
    pids_limit: 8
    ulimits:
      core: 0
    network_mode: none
    volumes: [reports:/data]
    depends_on:
      receiver:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: '1'
        compress: 'false'
  proxy:
    image: nginx:stable-alpine
    entrypoint: [nginx, -g, 'daemon off;']
    user: '101:101'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 16
    ulimits:
      core: 0
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m,mode=1777']
    ports: ['${DUPROVE_LISTEN:-127.0.0.1:8443}:8443']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${DUPROVE_TLS_DIR:?Set an absolute directory containing fullchain.pem and privkey.pem}
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    networks: [private, edge]
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      receiver:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: none
networks:
  private:
    internal: true
  edge: {}
volumes:
  reports: {}
